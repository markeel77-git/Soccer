name = "thunder-soccer"
main = "worker.js"
compatibility_date = "2025-01-01"

# KV namespace — create with: wrangler kv namespace create SOCCER_KV
# Then paste the resulting id below
[[kv_namespaces]]
binding = "KV"
id = "53e8ec3dfa6c4f2da157fc7bd67c2f73"

# Route is added manually in the Cloudflare dashboard → Workers Routes
# Pattern: soccer.theiehls.com/api/*   Worker: thunder-soccer

# To deploy:
#   1. npm install -g wrangler
#   2. wrangler login
#   3. wrangler kv namespace create SOCCER_KV   (paste id above)
#   4. wrangler secret put COACH_TOKEN          (enter your chosen password)
#   5. wrangler deploy
#
# Data keys: one per team, `team:<slug>` (team:boys, team:girls). The legacy key
# `thunder_v2` holds the Spring 2026 Thunder season and is served read-only at /api/data.
#
# Optional per-team write tokens (shared COACH_TOKEN always works for every team):
#   wrangler secret put COACH_TOKEN_GIRLS
#
# To seed a team from a JSON export:
#   wrangler kv key put --namespace-id=53e8ec3dfa6c4f2da157fc7bd67c2f73 "team:boys" "$(cat export.json)" --remote
