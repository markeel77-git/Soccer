<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sub Tracker — Choose Team</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23111111'/><text x='16' y='24' text-anchor='middle' font-size='22'>⚽</text></svg>">
<link rel="stylesheet" href="/app.css?v=20260914a">
<style>
.chooser{max-width:720px;margin:48px auto;padding:0 20px}
.chooser h1{font-family:var(--font-display,'Barlow Condensed',sans-serif);font-size:40px;font-weight:800;letter-spacing:.02em;margin:0 0 6px}
.chooser p{color:var(--text-secondary,#707072);margin:0 0 28px}
.team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.team-card{display:block;text-decoration:none;color:inherit;border:1px solid var(--grey-200,#e5e5e5);border-radius:12px;padding:24px;background:#fff;transition:transform .12s,box-shadow .12s}
.team-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.08)}
.team-card .emoji{font-size:40px;line-height:1;margin-bottom:12px}
.team-card .name{font-family:var(--font-display,'Barlow Condensed',sans-serif);font-size:28px;font-weight:800;letter-spacing:.02em}
.team-card .meta{color:var(--text-secondary,#707072);font-size:13px;margin-top:4px}
.team-card .last{display:inline-block;margin-top:12px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#1a7f37}
</style>
</head>
<body>
<div class="chooser">
  <h1>⚽ SUB TRACKER</h1>
  <p>Choose a team. Each team keeps its own roster, schedule, and season stats.</p>
  <div class="team-grid">
    <a class="team-card" href="/boys/" data-slug="boys">
      <div class="emoji">🐺</div>
      <div class="name">THUNDER WOLVES</div>
      <div class="meta">Boys · CF09A · soccer.theiehls.com/boys</div>
    </a>
    <a class="team-card" href="/girls/" data-slug="girls">
      <div class="emoji">🐬</div>
      <div class="name">BLUE DOLPHINS</div>
      <div class="meta">Girls · CF09R · soccer.theiehls.com/girls</div>
    </a>
  </div>
</div>
<script>
// Highlight the team this browser used most recently (set by app.js). Never auto-redirects.
try{
  const last=localStorage.getItem('subtracker_last_team');
  const card=last&&document.querySelector(`.team-card[data-slug="${last}"]`);
  if(card){const t=document.createElement('div');t.className='last';t.textContent='Last used on this device';card.appendChild(t);}
}catch(e){}
</script>
</body>
</html>
